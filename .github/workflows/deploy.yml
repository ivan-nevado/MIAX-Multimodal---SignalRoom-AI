# OPTIONAL manual deployment. Uses GitHub → AWS OIDC (no long-lived AWS keys in GitHub).
# Disabled until configured: create an IAM role trusting token.actions.githubusercontent.com
# for this repository and store its ARN in the repository variable AWS_DEPLOY_ROLE_ARN.
# API keys are NOT stored in GitHub: they live in AWS Secrets Manager (scripts/set_secrets.sh).
name: Deploy (manual)

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    if: ${{ vars.AWS_DEPLOY_ROLE_ARN != '' }}
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'eu-west-1' }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Deploy
        run: ./scripts/deploy.sh
